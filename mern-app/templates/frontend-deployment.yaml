apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend

spec:
  replicas: 2

  selector:
    matchLabels:
      app: frontend

  template:
    metadata:
      labels:
        app: frontend

    spec:
      containers:
        - name: frontend

          image: 943938400079.dkr.ecr.ap-south-1.amazonaws.com/mern-frontend:v3

          ports:
            - containerPort: 3000

          env:
            - name: HOST
              value: "0.0.0.0"

            - name: PORT
              value: "3000"
