name: MERN DevSecOps CI/CD

on:
  push:
    branches:
      - main

jobs:

  security-build-deploy:

    runs-on: ubuntu-latest

    steps:

    - name: Checkout Repository
      uses: actions/checkout@v4


    # Node Backend Dependency Check
    - name: Install Backend Dependencies
      working-directory: backend
      run: npm install


    # Frontend Dependency Check
    - name: Install Frontend Dependencies
      working-directory: frontend
      run: npm install


    # Trivy File Scan
    - name: Trivy Security Scan
      uses: aquasecurity/trivy-action@master
      with:
        scan-type: fs
        scan-ref: .


    # Docker Login AWS ECR
    - name: Configure AWS Credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: ap-south-1


    # Login ECR
    - name: Login to Amazon ECR
      uses: aws-actions/amazon-ecr-login@v2


    # Build Backend Image
    - name: Build Backend Image
      run: |
        docker build -t mern-backend ./backend


    # Build Frontend Image
    - name: Build Frontend Image
      run: |
        docker build -t mern-frontend ./frontend


    # Push Images to ECR
    - name: Push Images
      run: |

        docker tag mern-backend:latest \
        ${{ secrets.ECR_BACKEND_URL }}:latest

        docker tag mern-frontend:latest \
        ${{ secrets.ECR_FRONTEND_URL }}:latest


        docker push \
        ${{ secrets.ECR_BACKEND_URL }}:latest

        docker push \
        ${{ secrets.ECR_FRONTEND_URL }}:latest


    # Kubernetes Deployment Update
    - name: Update Kubernetes Deployment
      run: |
        kubectl set image deployment/backend \
        backend=${{ secrets.ECR_BACKEND_URL }}:latest

        kubectl set image deployment/frontend \
        frontend=${{ secrets.ECR_FRONTEND_URL }}:latest